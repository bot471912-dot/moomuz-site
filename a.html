<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Jeu Vache Pixel - Animation</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; image-rendering: pixelated; background:#87CEEB; }
#gameOverMenu {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%, -50%);
  background:rgba(0,0,0,0.8);
  color:white; padding:30px;
  text-align:center; font-family:monospace; display:none;
  border-radius:10px;
}
#restartButton {
  margin-top:20px; padding:10px 20px;
  font-size:16px; cursor:pointer; border:none;
  border-radius:5px; background-color:#27ae60; color:white;
}
#restartButton:hover { background-color:#2ecc71; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="gameOverMenu">
<h1>Game Over</h1>
<p id="finalScore">Score: 0</p>
<button id="restartButton">Recommencer</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GROUND_Y = canvas.height - 120;

let gravity=0.9, velocity=0, isJumping=false, score=0;
let gameSpeed=7, frame=0, night=false, gameOver=false;

// Animation vache
const cowSprites = [
  new Image(),
  new Image()
];
cowSprites[0].src = "https://github.com/bot471912-dot/moomuz-site/blob/site/marche1.png?raw=true";
cowSprites[1].src = "https://github.com/bot471912-dot/moomuz-site/blob/site/marche.png?raw=true";
let currentSprite = 0;

// cactus
const cactusSprite = new Image();
cactusSprite.src = "https://github.com/bot471912-dot/moomuz-site/blob/site/cactus.png?raw=true";

const cow = { x:120, y:GROUND_Y - 60, width:80, height:60 };
let obstacles = [];
let groundOffset = 0;

const jumpSound = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const gameOverSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

// Alterne les sprites toutes les 0.2 sec
setInterval(() => {
  currentSprite = (currentSprite + 1) % cowSprites.length;
}, 200);

function drawCow(x,y){
  // pattes blanches animées
  ctx.fillStyle="#fff";
  const legOffset = Math.sin(frame*0.3)*3;
  ctx.fillRect(x + cow.width/4, y + cow.height - 20, 8, 20 + legOffset);
  ctx.fillRect(x + cow.width*0.65, y + cow.height - 20, 8, 20 - legOffset);
  
  if(cowSprites[currentSprite].complete) ctx.drawImage(cowSprites[currentSprite], x, y, cow.width, cow.height);
}

function drawGround(){
  groundOffset -= gameSpeed;
  if(groundOffset <= -40) groundOffset=0;
  for(let i=0;i<canvas.width/20+2;i++){
    let x=i*20+groundOffset;
    ctx.fillStyle = "#FFD700"; 
    ctx.fillRect(x,GROUND_Y,20,20);
    ctx.fillStyle = "#E6C200";
    ctx.fillRect(x,GROUND_Y+20,20,10);
  }
}

function spawnObstacle(){
  obstacles.push({
    x:canvas.width,
    y:GROUND_Y - 60,
    width:30,
    height:60,
    hitboxOffsetX:5,
    hitboxOffsetY:10,
    hitboxWidth:20,
    hitboxHeight:50
  });
}

function showGameOver(){
  gameOver=true;
  gameOverSound.play();
  document.getElementById('finalScore').innerText='Score: '+score;
  document.getElementById('gameOverMenu').style.display='block';
}

function update(){
  if(gameOver) return;
  frame++;
  canvas.style.background = night?"#111":"#87CEEB";
  ctx.clearRect(0,0,canvas.width,canvas.height);

  velocity+=gravity;
  cow.y+=velocity;
  if(cow.y > GROUND_Y - cow.height){ cow.y=GROUND_Y - cow.height; velocity=0; isJumping=false; }

  drawCow(cow.x,cow.y);
  drawGround();

  for(let obs of obstacles){
    obs.x-=gameSpeed;
    if(cactusSprite.complete) ctx.drawImage(cactusSprite, obs.x, obs.y, obs.width, obs.height);
    else { ctx.fillStyle="#228B22"; ctx.fillRect(obs.x, obs.y, obs.width, obs.height); }

    // collision hitbox
    if(cow.x + cow.width > obs.x + obs.hitboxOffsetX &&
       cow.x < obs.x + obs.hitboxOffsetX + obs.hitboxWidth &&
       cow.y + cow.height > obs.y + obs.hitboxOffsetY &&
       cow.y < obs.y + obs.hitboxOffsetY + obs.hitboxHeight){
      showGameOver();
    }
  }

  score++;
  ctx.fillStyle = "black";
  ctx.font="24px monospace";
  ctx.fillText("Score: "+score,20,50);

  requestAnimationFrame(update);
}

cowSprites[0].onload = cowSprites[1].onload = ()=>{ update(); }
setInterval(spawnObstacle,1200);

window.addEventListener("keydown",(e)=>{
  if(e.code==="Space" && !isJumping && !gameOver){
    velocity=-18; isJumping=true; jumpSound.play();
  }
});

document.getElementById('restartButton').addEventListener('click',()=>{
  document.getElementById('gameOverMenu').style.display='none';
  obstacles=[]; cow.y=GROUND_Y - cow.height;
  score=0; gameOver=false; frame=0; update();
});
</script>
</body>
</html>
